        },
        "resources_server": {
          "name": "single_step_tool_use_with_argument_comparison_resources_server",
          "type": "resources_servers"
        }
      }
    }
  },
  "single_step_tool_use_with_argument_comparison_resources_server": {
    "resources_servers": {
      "single_step_tool_use_with_argument_comparison": {
        "description": "Conversational tool-use RL from expert trajectories; behavior cloning per step across auth, lookup, and servicing domains.",
        "domain": "agent",
        "entrypoint": "app.py",
        "tool_call_comparator_config": {
          "word_count_similarity_threshold": 0.1
        },
        "verified": false
      }
    }
  },
  "tau2": {
    "responses_api_agents": {
      "tau2": {
        "entrypoint": "app.py",
        "domain": "agent",
        "description": "tau2-bench telecom training tasks (non-eval split); tau2 evaluator 0/1 reward with NemotronVC shaping.",
        "value": "Improve multi-turn agentic capability with a hosted user simulator.",
        "model_server": {
          "type": "responses_api_models",
          "name": "policy_model"
        },
        "user_model_server": {
          "type": "responses_api_models",
          "name": "sim_gptoss"
        },
        "user_llm_args": {
          "temperature": 0.7
        },
        "max_steps": 200,
        "max_agent_steps": 30,
        "turns_remaining_interval": 1,
        "num_workers": 96,
        "debug": false,
        "print_step_counts": false,
        "datasets": [],
        "tool_not_found_penalty": 0.05,
        "tool_not_found_penalty_cap": 0.3,
        "tool_not_found_substring": "error: tool '",
        "zero_reward_on_transfer_domains": [
          "telecom"
        ]
      }
    }
  },
  "toolcall_schema_single_step_tool_use_with_argument_comparison_agent": {
