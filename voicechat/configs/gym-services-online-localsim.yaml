{
  "conversational_tool_use_agent": {
    "responses_api_agents": {
      "conversational_tool_use/simulation": {
        "entrypoint": "app.py",
        "resources_server": {
          "type": "resources_servers",
          "name": "conversational_tool_use_simulation"
        },
        "model_server": {
          "type": "responses_api_models",
          "name": "policy_model"
        },
        "max_agent_steps": 30,
        "seed_first_user_message": true,
        "datasets": []
      }
    }
  },
  "conversational_tool_use_simulation": {
    "resources_servers": {
      "conversational_tool_use_simulation": {
        "entrypoint": "app.py",
        "domain": "agent",
        "verified": false,
        "description": "Conversational tool-use simulation environment.",
        "simulator_model_server": {
          "type": "responses_api_models",
          "name": "sim_gptoss"
        },
        "user_model_server": {
          "type": "responses_api_models",
          "name": "sim_gptoss"
        },
        "tool_simulator_model_server": {
          "type": "responses_api_models",
          "name": "sim_gptoss"
        },
        "judge_model_server": {
          "type": "responses_api_models",
          "name": "sim_gptoss"
        },
        "user_responses_create_params": {
          "input": [],
          "temperature": 0.7,
          "top_p": 1.0,
          "max_output_tokens": 4096,
          "parallel_tool_calls": false
        },
        "tool_simulator_responses_create_params": {
          "input": [],
          "temperature": 0.3,
          "top_p": 1.0,
          "max_output_tokens": 4096,
          "parallel_tool_calls": false
        },
        "judge_responses_create_params": {
          "input": [],
          "temperature": 0.0,
          "top_p": 1.0,
          "max_output_tokens": 4096,
          "parallel_tool_calls": false
        },
        "generation_attempts": 3,
        "judge_provider_attempts": 3,
        "judge_provider_retry_initial_backoff_seconds": 0.5,
        "judge_provider_retry_max_backoff_seconds": 8.0,
        "enable_llm_judge": true,
        "enable_termination": true,
        "verification_type": "message",
        "enforce_transfer_ground_truth": true
      }
    }
  },
  "policy_model": {
    "responses_api_models": {
      "vllm_model": {
        "api_key": "${policy_api_key}",
        "base_url": "${policy_base_url}",
        "chat_template_kwargs": {
          "enable_thinking": true,
          "truncate_history_thinking": false
        },
        "engine_data_parallel_size": 8,
        "entrypoint": "app.py",
        "model": "${policy_model_name}",
        "num_workers": 16,
        "request_prompt_and_generation_token_ids": true,
        "return_token_id_information": true,
        "sequential_reasoning_allowed": false,
        "uses_reasoning_parser": true
      }
    }
  },
  "search_pivot_single_step_tool_use_with_argument_comparison_agent": {
    "responses_api_agents": {
      "tool_simulation_agent": {
        "datasets": [],
        "entrypoint": "app.py",
        "model_server": {
          "name": "policy_model",
          "type": "responses_api_models"
        },
        "resources_server": {
          "name": "search_pivot_single_step_tool_use_with_argument_comparison_resources_server",
          "type": "resources_servers"
        }
      }
    }
  },
  "search_pivot_single_step_tool_use_with_argument_comparison_resources_server": {
    "resources_servers": {
      "single_step_tool_use_with_argument_comparison": {
        "description": "The model must output the next correct call in a given trajectory involving search tools.",
        "domain": "agent",
        "entrypoint": "app.py",
        "tool_call_comparator_config": {
          "word_count_similarity_threshold": 0.3
        },
        "value": "Improve agentic search capability.",
        "verified": false
      }
    }
  },
  "sim_gptoss": {
    "responses_api_models": {
      "openai_model": {
        "entrypoint": "app.py",
        "openai_base_url": "${oc.env:NVC_SIM_BASE_URL}",
        "openai_api_key": "${oc.env:NVC_SIM_API_KEY}",
        "openai_model": "gpt-oss-120b",
        "openai_default_headers": {},
        "extra_body": {
          "reasoning_effort": "low",
          "reasoning": {
            "effort": "low"
          }
        },
        "drop_input_reasoning_items": true,
        "max_concurrent_requests": 768,
        "num_workers": 1
      }
    }
  },
  "single_step_tool_use_with_argument_comparison_agent": {
    "responses_api_agents": {
      "tool_simulation_agent": {
        "datasets": [],
        "entrypoint": "app.py",
        "model_server": {
          "name": "policy_model",
