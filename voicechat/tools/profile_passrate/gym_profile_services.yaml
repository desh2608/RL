# ---------------------------------------------------------------------------
# NeMo Gym service config for the HF399 pass-rate profile (scripts/profile_passrate/).
#
# One file, 18 server entries (2 model wrappers + 8 resources servers + 8 agents), so that
# `gym env status` must report "18 servers found (18 healthy ...)" before rollouts start.
#
# Provenance of each block:
#  * policy_model / simulator_model: responses_api_models/vllm_model/configs/vllm_model.yaml
#    (the stock-vLLM form the eval workspace used against a DP8 `vllm serve`) plus the training
#    chat_template_kwargs from runs/train-v1-20260928T023000Z/gym-configs/000-gym-services-light-rules-only-code-math.yaml.
#    `return_token_id_information` / `request_prompt_and_generation_token_ids` are FALSE here on
#    purpose: those two are NeMo-RL HTTP-server extensions (frozen recipe sets them true) and a
#    stock `vllm serve` does not implement them.
#  * single_step / toolcall_schema / search_pivot servers + agents: copied verbatim from the frozen
#    v8 recipe above (word_count_similarity_threshold 0.3 / 0.1 / 0.1), datasets dropped.
#  * instruction_following, structured_outputs: frozen v8 recipe, datasets dropped.
#  * multichallenge: Gym upstream resources_servers/multichallenge/configs/multichallenge_nrl.yaml
#    (judge_model_server = policy_model) with judge max_output_tokens raised 512 -> 8192 because
#    the policy judges with thinking enabled (VERIFY judge behaviour on first run).
#  * workplace_assistant: Gym upstream resources_servers/workplace_assistant/configs/workplace_assistant.yaml
#    (simple_agent max_steps 6; the eval workspace used 10).
#  * conversational_tool_use_simulation + conversational_tool_use_agent: Gym upstream
#    resources_servers/conversational_tool_use_simulation/configs/conversational_tool_use_simulation.yaml,
#    byte-equivalent to the blocks in config/gym-services-v1.yaml; simulator_model written out in full
#    instead of the upstream `_copy: policy_model` directive.
#
# Interpolated keys are supplied on the CLI by launch_profile.sh:
#   --model <served-model-name> -> policy_model_name, --model-url '["http://127.0.0.1:PORT/v1"]' -> policy_base_url,
#   --model-api-key dummy -> policy_api_key.
# ---------------------------------------------------------------------------

policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      return_token_id_information: false
      request_prompt_and_generation_token_ids: false
      uses_reasoning_parser: true
      uses_interleaved_reasoning: true
      chat_template_kwargs:
        enable_thinking: true
        truncate_history_thinking: false
      extra_body: null
      default_headers: {}
      num_workers: 16

simulator_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      return_token_id_information: false
      request_prompt_and_generation_token_ids: false
      uses_reasoning_parser: true
      uses_interleaved_reasoning: true
      chat_template_kwargs:
        enable_thinking: true
        truncate_history_thinking: false
      extra_body: null
      default_headers: {}
      num_workers: 16

