      resources_server:
        name: parallel_tool_calls_single_step_tool_use_with_argument_comparison_resources_server
        type: resources_servers
parallel_tool_calls_single_step_tool_use_with_argument_comparison_resources_server:
  resources_servers:
    single_step_tool_use_with_argument_comparison:
      description: "Parallel tool-call verification; the model must emit exactly the\
        \ expected set of tool calls (function_call_batch gold) in a single turn,\
        \ in any order. binary_strict: 1.0 only when every expected call is matched\
        \ and no surplus call is emitted (allow_subset false, allow_superset false),\
        \ else 0.0 \u2014 mirrors BFCL parallel scoring."
      domain: agent
      entrypoint: app.py
      tool_call_comparator_config:
        word_count_similarity_threshold: 0.1
        parallel_tool_call_rewarding: true
        allow_subset: false
        allow_superset: false
        parallel_tool_call_reward_mode: binary_strict
      verified: false
