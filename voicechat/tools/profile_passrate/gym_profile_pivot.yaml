  resources_servers:
    single_step_tool_use_with_argument_comparison:
      description: 'BFCL-irrelevance-shaped near-miss prompts (message gold): a fresh
        user request with 1-4 tools of which one looks lexically relevant but cannot
        fulfil it; the right action is to answer, clarify or decline; any tool call
        scores 0.'
      domain: agent
      entrypoint: app.py
      tool_call_comparator_config:
        word_count_similarity_threshold: 0.1
      verified: false
parallel_tool_calls_single_step_tool_use_with_argument_comparison_agent:
  responses_api_agents:
    tool_simulation_agent:
      datasets: []
      entrypoint: app.py
      model_server:
        name: policy_model
