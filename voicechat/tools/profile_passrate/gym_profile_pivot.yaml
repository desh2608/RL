# Gym services for the pivot candidate pass-rate profile (profile_passrate/profile_candidates.sbatch): policy_model block from
# scripts/profile_passrate/gym_profile_services.yaml (stock vllm serve), 8 single-step routes copied unchanged from
# config/gym-services-static-v8.yaml (same verifiers as RL training).
policy_model:
  responses_api_models:
    vllm_model:
      entrypoint: app.py
      base_url: ${policy_base_url}
      api_key: ${policy_api_key}
      model: ${policy_model_name}
      return_token_id_information: false
      request_prompt_and_generation_token_ids: false
      uses_reasoning_parser: true
      uses_interleaved_reasoning: true
      chat_template_kwargs:
        enable_thinking: true
        truncate_history_thinking: false
      extra_body: null
      default_headers: {}
      num_workers: 16
single_step_tool_use_with_argument_comparison_agent:
  responses_api_agents:
    tool_simulation_agent:
      datasets: []
      entrypoint: app.py
      model_server:
        name: policy_model
        type: responses_api_models
      resources_server:
        name: single_step_tool_use_with_argument_comparison_resources_server
        type: resources_servers
single_step_tool_use_with_argument_comparison_resources_server:
  resources_servers:
    single_step_tool_use_with_argument_comparison:
      description: Conversational tool-use RL from expert trajectories; behavior cloning
        per step across auth, lookup, and servicing domains.
      domain: agent
      entrypoint: app.py
      tool_call_comparator_config:
        word_count_similarity_threshold: 0.1
      verified: false
multiturn_single_call_single_step_tool_use_with_argument_comparison_agent:
  responses_api_agents:
    tool_simulation_agent:
      datasets: []
      entrypoint: app.py
      model_server:
        name: policy_model
        type: responses_api_models
      resources_server:
        name: multiturn_single_call_single_step_tool_use_with_argument_comparison_resources_server
        type: resources_servers
multiturn_single_call_single_step_tool_use_with_argument_comparison_resources_server:
  resources_servers:
    single_step_tool_use_with_argument_comparison:
      description: Single next tool call inside an SFT tool-use dialog prefix (>=1
        earlier call and tool result in context); function_call gold with the strict
        single-call contract (>=2 calls or text score 0).
      domain: agent
      entrypoint: app.py
      tool_call_comparator_config:
        word_count_similarity_threshold: 0.1
      verified: false
