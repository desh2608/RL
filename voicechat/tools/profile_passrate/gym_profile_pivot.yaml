hard_no_call_single_step_tool_use_with_argument_comparison_resources_server:
  resources_servers:
    single_step_tool_use_with_argument_comparison:
      description: 'No-call turns (message gold) from SFT dialogs and library rows:
        the right action is to answer, clarify, or decline because the available tools
        cannot fulfil the request; any tool call scores 0.'
      domain: agent
      entrypoint: app.py
      tool_call_comparator_config:
